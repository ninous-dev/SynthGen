[pytest]
testpaths = testsuite

filterwarnings =
    # SimpleITK internal deprecation (tostring → tobytes), not our code
    ignore::DeprecationWarning:SimpleITK

addopts =
    --cov=transforms_class
    --cov-report=term-missing
    --cov-report=html:coverage_html

[coverage:run]
source = transforms_class
omit =
    transforms_class/__init__.py

[coverage:report]
show_missing = true
skip_covered = false
